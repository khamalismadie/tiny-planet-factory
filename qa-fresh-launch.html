<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TPF QA — Fresh Launch</title>
  <style>
    html, body { margin: 0; height: 100%; display: grid; place-items: center; background: #0b1220; color: #e6eef7; font: 14px system-ui, sans-serif; }
    #s { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div id="s">Menghapus save lama…</div>
  <script>
    const PROBE = '/?debug=1&perf=1&quality=medium&qa=1&qaObjects=94&qaSeconds=180&seed=1';
    const s = document.getElementById('s');
    let done = false;
    function launch(reason) {
      if (done) return;
      done = true;
      s.textContent = reason + ' — membuka probe…';
      setTimeout(() => location.replace(PROBE), 200);
    }
    try {
      const req = indexedDB.deleteDatabase('tiny-planet-factory');
      req.onsuccess = () => launch('Save dihapus');
      req.onerror = () => launch('Gagal hapus save, tetap lanjut');
      req.onblocked = () => launch('Hapus save tertunda, tetap lanjut');
      setTimeout(() => launch('Timeout, tetap lanjut'), 2000);
    } catch (error) {
      launch('IndexedDB error, tetap lanjut');
    }
  </script>
</body>
</html>
