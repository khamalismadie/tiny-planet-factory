<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA fresh — Tiny Planet Factory</title>
</head>
<body>
  <p>Menyiapkan probe QA...</p>
  <script>
    (async () => {
      try { await indexedDB.deleteDatabase('tiny-planet-factory'); } catch (_) {}
      try {
        await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          await Promise.race([
            new Promise((resolve) => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })),
            new Promise((resolve) => setTimeout(resolve, 5000)),
          ]);
        }
      } catch (_) {}
      const params = new URLSearchParams(location.search);
      const target = params.get('target') || '/?debug=1&perf=1&quality=medium&qa=1&qaObjects=94&qaSeconds=180&seed=1';
      location.replace(target);
    })();
  </script>
</body>
</html>
