<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TPF QA Helper</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #0b1220; color: #e6eef7; }
    header { padding: 10px 12px; background: #142238; display: flex; gap: 8px; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 10px 12px; background: #2f81f7; color: white; font-weight: 600; }
    button.small { background: #334b68; }
    #status { font-size: 12px; color: #9fb6cf; flex: 1; }
    iframe { width: 100%; height: calc(100% - 56px); border: 0; background: #05070c; }
    textarea { position: fixed; inset: 56px 0 0 0; width: 100%; height: calc(100% - 56px); box-sizing: border-box;
      border: 0; padding: 12px; font: 11px/1.4 monospace; background: #05070c; color: #b8e0c2; display: none; resize: none; }
  </style>
</head>
<body>
  <header>
    <button id="copy">Salin laporan QA</button>
    <button id="toggle" class="small">Lihat JSON</button>
    <span id="status">Probe 180 s berjalan di iframe…</span>
  </header>
  <iframe id="game" src="/?debug=1&perf=1&quality=medium&qa=1&qaObjects=94&qaSeconds=180&seed=1" allow="fullscreen"></iframe>
  <textarea id="out" readonly></textarea>
  <script>
    const frame = document.getElementById('game');
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    document.getElementById('copy').addEventListener('click', async () => {
      try {
        const api = frame.contentWindow.__game;
        if (!api || typeof api.qaReport !== 'function') throw new Error('Game belum siap');
        const text = JSON.stringify(api.qaReport(), null, 2);
        out.value = text;
        await navigator.clipboard.writeText(text);
        status.textContent = 'Laporan tersalin ke clipboard (' + text.length + ' char).';
      } catch (error) {
        status.textContent = 'Gagal: ' + error.message;
        out.value = String(error.stack || error);
        out.style.display = 'block';
      }
    });
    document.getElementById('toggle').addEventListener('click', () => {
      out.style.display = out.style.display === 'block' ? 'none' : 'block';
    });
  </script>
</body>
</html>
