name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Eight gates
        run: npm test
      - name: Build
        run: npm run build
      - name: App chunk budget
        run: |
          APP_JS=$(find dist/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          SIZE=$(stat -c %s "$APP_JS")
          echo "app chunk: $SIZE bytes ($APP_JS)"
          node -e "if (Number(process.argv[1]) >= 100000) { console.error('app chunk >= 100 kB'); process.exit(1); }" "$SIZE"
      - name: Whitespace check
        run: git diff --check
